---
layout: default
---
<section class="places">
  <ul class="city-list" id="cityList">
    <li class="city" data-i="0"><span class="nm">New York</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
    <li class="city" data-i="1"><span class="nm">Dubai</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
    <li class="city" data-i="2"><span class="nm">Bangalore</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
    <li class="city" data-i="3"><span class="nm">Kozhikode</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
    <li class="city" data-i="4"><span class="nm">Palakkad</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
    <li class="city" data-i="5"><span class="nm">Thrissur</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
    <li class="city" data-i="6"><span class="nm">Malappuram</span><span class="tm">··:··</span><span class="cond">—</span><span class="tp">—</span></li>
  </ul>
  <div class="places-note" id="placesNote">fetching…</div>
</section>

<script>
(function () {
  var CITIES = [
    { tz: "America/New_York", lat: 40.7128, lon: -74.0060 },
    { tz: "Asia/Dubai",       lat: 25.2048, lon: 55.2708 },
    { tz: "Asia/Kolkata",     lat: 12.9716, lon: 77.5946 },
    { tz: "Asia/Kolkata",     lat: 11.2588, lon: 75.7804 },
    { tz: "Asia/Kolkata",     lat: 10.7867, lon: 76.6548 },
    { tz: "Asia/Kolkata",     lat: 10.5276, lon: 76.2144 },
    { tz: "Asia/Kolkata",     lat: 11.0510, lon: 76.0711 }
  ];
  // WMO weather codes -> plain words
  var WMO = {
    0: "clear", 1: "mostly clear", 2: "part cloudy", 3: "overcast",
    45: "fog", 48: "freezing fog", 51: "light drizzle", 53: "drizzle", 55: "heavy drizzle",
    56: "freezing drizzle", 57: "freezing drizzle", 61: "light rain", 63: "rain", 65: "heavy rain",
    66: "freezing rain", 67: "freezing rain", 71: "light snow", 73: "snow", 75: "heavy snow",
    77: "snow grains", 80: "showers", 81: "showers", 82: "heavy showers",
    85: "snow showers", 86: "snow showers", 95: "thunderstorm", 96: "thunderstorm", 99: "thunderstorm"
  };

  var nodes = Array.prototype.slice.call(document.querySelectorAll("#cityList .city"));
  var note = document.getElementById("placesNote");

  function clockFor(tz) {
    try {
      return new Intl.DateTimeFormat("en-GB", {
        hour: "2-digit", minute: "2-digit", hour12: false, timeZone: tz
      }).format(new Date());
    } catch (e) { return "··:··"; }
  }

  function tickClocks() {
    nodes.forEach(function (li, i) {
      li.querySelector(".tm").textContent = clockFor(CITIES[i].tz);
    });
  }

  function paint(i, temp, code, isDay) {
    var li = nodes[i];
    if (!li) return;
    li.querySelector(".tp").textContent = Math.round(temp) + "°";
    li.querySelector(".cond").textContent = WMO[code] || "—";
    li.classList.toggle("night", isDay === 0);
    li.classList.add("live");
  }

  function load() {
    var lat = CITIES.map(function (c) { return c.lat; }).join(",");
    var lon = CITIES.map(function (c) { return c.lon; }).join(",");
    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
              "&longitude=" + lon + "&current=temperature_2m,weather_code,is_day&timezone=auto";
    fetch(url)
      .then(function (r) { if (!r.ok) throw new Error("weather " + r.status); return r.json(); })
      .then(function (data) {
        var list = Array.isArray(data) ? data : [data];
        list.forEach(function (d, i) {
          if (d && d.current) paint(i, d.current.temperature_2m, d.current.weather_code, d.current.is_day);
        });
        note.textContent = "live · updated " + clockFor("Asia/Dubai") + " Dubai time";
      })
      .catch(function () {
        note.textContent = "weather unavailable right now";
      });
  }

  tickClocks();
  setInterval(tickClocks, 10000);
  load();
  setInterval(load, 600000); // refresh every 10 min
})();
</script>
